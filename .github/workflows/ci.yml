name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: teenure
          POSTGRES_PASSWORD: teenure_dev_only
          POSTGRES_DB: teenure_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U teenure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # conftest.py's DATABASE_URL points at teenure_test on :5434, matching
      # this job's postgres service (see apps/api/tests/conftest.py).
      - name: Apply migrations
        env:
          PGPASSWORD: teenure_dev_only
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $(basename "$f") ..."
            psql -v ON_ERROR_STOP=1 -h localhost -p 5434 -U teenure -d teenure_test -f "$f"
          done

      - name: Run pytest
        working-directory: apps/api
        run: python -m pytest -q

  web-unit-tests:
    name: Web unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest suite
        working-directory: apps/web
        run: pnpm test

  web-lint:
    name: Web lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: apps/web
        run: pnpm lint

  web-build:
    name: Web build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web

      - name: Typecheck (tsc --noEmit)
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # No live Supabase/FastAPI backend in this job -- only the
      # unauthenticated /demo/rep portal and the two public /rep/* pages
      # get exercised (see tests-e2e/*.spec.ts for scope notes).
      - name: Run Playwright suite
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  web-e2e-auth:
    name: Web E2E, authenticated (Playwright + local Supabase)
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every file in supabase/migrations/ automatically and
      # prints the local API URL/DB URL/keys this job wires into both
      # apps' env below. See supabase/config.toml and README.md's
      # "Local database + auth" section for what this stands up.
      - name: Start local Supabase
        id: supabase
        run: |
          supabase start
          STATUS=$(supabase status -o env)
          get() { echo "$STATUS" | grep "^$1=" | cut -d= -f2- | tr -d '"'; }
          echo "api_url=$(get API_URL)" >> "$GITHUB_OUTPUT"
          echo "db_url=$(get DB_URL)" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(get ANON_KEY)" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$(get SERVICE_ROLE_KEY)" >> "$GITHUB_OUTPUT"
          echo "jwt_secret=$(get JWT_SECRET)" >> "$GITHUB_OUTPUT"

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start apps/api
        working-directory: apps/api
        env:
          ENVIRONMENT: development
          ALLOWED_ORIGINS: http://localhost:3300
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          DATABASE_URL: ${{ steps.supabase.outputs.db_url }}
          SUPABASE_JWT_SECRET: ${{ steps.supabase.outputs.jwt_secret }}
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_PUBLISHABLE_KEY: pk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          RESEND_API_KEY: re_ci
          RESEND_PARENT_CONSENT_TEMPLATE_ID: tmpl_ci
          RESEND_PARENT_MAGIC_LINK_TEMPLATE_ID: tmpl_ci
          RESEND_PARENT_DIGEST_TEMPLATE_ID: tmpl_ci
          NEXT_PUBLIC_APP_URL: http://localhost:3300
          API_URL: http://localhost:8300
          ADMIN_SECRET_KEY: admin-secret-ci
          JOBS_RUNNER_SECRET: jobs-secret-ci
          PARENT_SESSION_SECRET: parent-session-secret-ci
        run: |
          nohup uvicorn app.main:app --port 8300 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8300/health && exit 0
            sleep 1
          done
          echo "apps/api did not become healthy in time"; cat /tmp/api.log; exit 1

      - name: Run authenticated Playwright suite
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          NEXT_PUBLIC_APP_URL: http://localhost:3300
          NEXT_PUBLIC_API_URL: http://localhost:8300
        run: pnpm test:e2e:auth

      - name: Upload authenticated Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: apps/web/playwright-report-auth/
          retention-days: 14
